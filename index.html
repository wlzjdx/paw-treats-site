    function updateCount(){document.getElementById('cart-count').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
    function toast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
    function petSvg(pet){return pet==='cat'?`<svg viewBox="0 0 220 210" role="img" aria-label="猫咪插画"><path d="M28 93 23 20l53 39Q110 44 145 59l54-39-6 73q12 28 5 60-12 49-88 49-75 0-88-49-6-32 6-60" fill="#fff6e6" stroke="#525046" stroke-width="6" stroke-linejoin="round"/><path d="M43 77 39 44l27 23M177 77l5-33-27 23" fill="#efb7ab"/><ellipse cx="75" cy="124" rx="7" ry="10" fill="#525046"/><ellipse cx="146" cy="124" rx="7" ry="10" fill="#525046"/><path d="m104 144 6 5 6-5" fill="#ef9e92" stroke="#525046" stroke-width="4" stroke-linejoin="round"/><path d="M110 149v9m0 0q-10 11-23 0m23 0q10 11 23 0" fill="none" stroke="#525046" stroke-width="4" stroke-linecap="round"/><path d="M53 149 22 144m32 13-31 3m143-11 31-5m-31 13 31 3" stroke="#525046" stroke-width="3" stroke-linecap="round"/><ellipse cx="56" cy="145" rx="13" ry="7" fill="#f8cbc1"/><ellipse cx="164" cy="145" rx="13" ry="7" fill="#f8cbc1"/></svg>`:`<svg viewBox="0 0 290 260" role="img" aria-label="狗狗插画"><path d="M72 77Q37 32 13 65 0 88 28 151q13 18 45-1M218 77q35-45 59-12 13 23-15 86-13 18-45-1" fill="#a96846" stroke="#555047" stroke-width="6"/><path d="M73 50q72-31 145 0 39 37 31 122-7 75-104 76-97-1-104-76-8-85 32-122" fill="#d59a6b" stroke="#555047" stroke-width="6"/><path d="M109 77q36-22 73 0l26 56q-9 16-25 8-15-10-38-10t-38 10q-17 8-25-8z" fill="#f8e4c4"/><ellipse cx="97" cy="135" rx="8" ry="11" fill="#4e4942"/><ellipse cx="193" cy="135" rx="8" ry="11" fill="#4e4942"/><ellipse cx="145" cy="181" rx="47" ry="36" fill="#fff2db"/><path d="M128 163q17-12 34 0-2 17-17 17t-17-17" fill="#4e4942"/><path d="M145 180v15m0 0q-13 12-28-1m28 1q13 12 28-1" fill="none" stroke="#4e4942" stroke-width="5" stroke-linecap="round"/><ellipse cx="65" cy="170" rx="14" ry="8" fill="#e8a789"/><ellipse cx="225" cy="170" rx="14" ry="8" fill="#e8a789"/></svg>`}
    function art(p){return `<div class="product-art" style="background:${p.color}" aria-label="${p.name}示意插画"><div class="packet" style="background:${p.packet}"><span class="packet-brand">爪爪零食铺</span><span class="packet-icon" aria-hidden="true">${p.icon}</span><span class="packet-band">${p.pet==='cat'?'喵喵喜欢':'汪汪喜欢'}</span></div></div>`}
    function card(p,rank){return `<article class="product ${rank?'ranked-product':''}">${rank?`<span class="rank-badge rank-${rank}">TOP ${rank}</span>`:''}<a href="#/product/${p.id}" aria-label="查看${p.name}详情">${art(p)}</a><div class="product-body"><div class="product-meta">${p.tag} · ${p.size}<span class="demo-tag">示例</span></div><h3><a href="#/product/${p.id}">${p.name}</a></h3><p class="product-sales">月销量（示例）${p.sales} 件</p><p class="product-desc">${p.subtitle}</p><div class="product-bottom"><span class="price"><small>¥</small>${p.price.toFixed(2)}</span><button class="add-mini" data-add="${p.id}" aria-label="将${p.name}加入购物袋">+</button></div></div></article>`}
    function home(){return `<div class="container"><section class="hero"><div class="hero-grid"><div class="hero-copy"><div class="eyebrow">A LITTLE TREAT, A LOT OF LOVE</div><h1>把喜欢，<br><span>装进每一口。</span></h1><p>给毛孩子的小小奖励，也值得充满仪式感。来挑一袋让尾巴摇起来、让呼噜声响起来的快乐吧。</p><div class="hero-actions"><a class="btn btn-primary" href="#/shop">逛逛零食 <span>↗</span></a><a class="btn btn-light" href="#/shop?pet=cat">先看猫咪款</a></div></div><div class="hero-art" aria-hidden="true"><div class="sun"></div><span class="spark s1">✦</span><span class="spark s2">✳</span><span class="spark s3">✦</span><div class="hero-pet hero-dog">${petSvg('dog')}</div><div class="hero-pet hero-cat">${petSvg('cat')}</div><div class="hero-note">今天也要开心吃零食 ♡</div></div></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">PICK YOUR LITTLE FRIEND</div><h2>按照喜好转转</h2></div></div><div class="categories"><a href="#/shop?pet=cat" class="category"><div><h3>猫咪零食</h3><p>喵～今天想吃什么？</p><span class="arrow">↗</span></div><div class="round">${petSvg('cat')}</div></a><a href="#/shop?pet=dog" class="category"><div><h3>狗狗零食</h3><p>汪！奖励时刻到啦</p><span class="arrow">↗</span></div><div class="round">${petSvg('dog')}</div></a></div></section><section class="section" style="padding-top:30px"><div class="section-head"><div><div class="eyebrow">HAPPY PAWS TOP PICKS</div><h2>热销榜 · 大家都在逛</h2><p class="section-lead">按示例月销量排序，仅用于演示榜单样式，并非真实销售记录。</p></div><a class="text-link" href="#/bestsellers">查看完整榜单 →</a></div><div class="products">${bestsellers.slice(0,3).map((p,i)=>card(p,i+1)).join('')}</div></section><section class="section" style="padding-top:30px"><div class="section-head"><div><div class="eyebrow">FAVORITES FOR HAPPY PAWS</div><h2>从这一口开始喜欢</h2><p class="section-lead">六款示例零食，带你体验给猫咪和狗狗挑选心意的快乐。</p></div><a class="text-link" href="#/shop">查看全部 →</a></div><div class="products">${products.slice(0,3).map(card).join('')}</div></section><section class="section"><div class="promise"><div class="promise-item"><span class="promise-icon">🐾</span><div><h3>按喜好慢慢挑</h3><p>猫咪与狗狗分区展示，找到喜欢的那一袋。</p></div></div><div class="promise-item"><span class="promise-icon">🎁</span><div><h3>把奖励变成仪式</h3><p>从日常互动到训练时刻，给陪伴一点甜。</p></div></div><div class="promise-item"><span class="promise-icon">💛</span><div><h3>轻松体验选购</h3><p>在样站中试试筛选、加入购物袋与模拟结算。</p></div></div></div></section><section class="section"><div class="story"><div class="story-visual" aria-hidden="true"><span class="huge">🦴</span><span class="sticker">给最好的小伙伴 ♡</span></div><div class="story-copy"><div class="eyebrow">A SHOP FOR LITTLE MOMENTS</div><h2>每一声“好乖”，<br>都值得一份小奖励。</h2><p>爪爪零食铺是一个宠物零食购物体验样站。我们用活泼的颜色与可爱的插画，想象和毛孩子一起度过的日常小片刻。</p><ul class="story-points"><li>挑选适合猫咪或狗狗的示例零食</li><li>加入购物袋，体验完整的浏览流程</li><li>模拟确认订单，不产生真实交易</li></ul><a class="btn btn-primary" href="#/shop">去挑一袋零食 →</a></div></div></section></div>`}
    function shop(){let pet=new URLSearchParams(location.hash.split('?')[1]||'').get('pet');if(!['cat','dog'].includes(pet))pet='all';let list=pet==='all'?products:products.filter(p=>p.pet===pet);return `<div class="container page-wrap"><div class="eyebrow">THE TREAT SHELF</div><h1 class="page-title">今天想选哪一袋？</h1><p class="page-intro">慢慢逛，找到毛孩子喜欢的小快乐。商品与价格均为演示示例。</p><div class="filterbar" role="group" aria-label="筛选宠物零食"><a class="chip ${pet==='all'?'active':''}" href="#/shop">全部零食 · 6</a><a class="chip ${pet==='cat'?'active':''}" href="#/shop?pet=cat">🐱 猫咪零食 · 3</a><a class="chip ${pet==='dog'?'active':''}" href="#/shop?pet=dog">🐶 狗狗零食 · 3</a><a class="chip" href="#/bestsellers">🔥 热销榜</a></div><div class="products">${list.map(card).join('')}</div></div>`}
    function bestsellerPage(){return `<div class="container page-wrap"><div class="eyebrow">THE HAPPY PAWS CHART</div><h1 class="page-title">热销榜</h1><p class="page-intro">根据示例月销量由高到低排列。榜单数据仅作样站演示，不代表真实销量或购买评价。</p><div class="products">${bestsellers.map((p,i)=>card(p,i+1)).join('')}</div></div>`}
    function detail(id){let p=products.find(x=>x.id===id);if(!p)return notFound();detailQty=1;return `<div class="container page-wrap"><div class="breadcrumb"><a href="#/">首页</a> / <a href="#/shop">全部零食</a> / ${p.name}</div><div class="detail">${art(p)}<div><div class="eyebrow">${p.pet==='cat'?'FOR HAPPY CATS':'FOR HAPPY DOGS'} · 示例商品</div><h1>${p.name}</h1><p class="product-sales">月销量（示例）${p.sales} 件</p><p class="detail-copy">${p.subtitle}。这是一款用于展示购物体验的示例零食，产品信息和插画将在正式销售时替换。</p><div class="detail-price"><small>¥</small>${p.price.toFixed(2)}</div><div class="detail-spec"><strong>示例规格</strong>${p.size}<br><strong>适用对象</strong>${p.pet==='cat'?'猫咪':'狗狗'}</div><div class="detail-actions"><div class="stepper" aria-label="选择数量"><button data-detail-qty="-1" aria-label="减少数量">−</button><span id="detail-qty">1</span><button data-detail-qty="1" aria-label="增加数量">+</button></div><button class="btn btn-primary" data-add-detail="${p.id}">加入购物袋 ↗</button></div><p class="fine-print">* 本页面仅作样站展示；规格、价格、成分与适用性均非真实产品信息。请勿据此喂食宠物。</p></div></div></div>`}
    function cartTotals(){let count=0,total=0;for(const p of products){let q=cart[p.id]||0;count+=q;total+=q*p.price}return {count,total:Math.round(total*100)/100}}
    function cartPage(){let {count,total}=cartTotals();if(!count)return `<div class="container page-wrap"><h1 class="page-title">我的购物袋</h1><div class="empty"><div class="empty-icon">🛍️</div><h2>购物袋还空着呢</h2><p>去挑几袋毛孩子喜欢的小零食吧。</p><a class="btn btn-primary" href="#/shop">逛逛零食 →</a></div></div>`;return `<div class="container page-wrap"><div class="eyebrow">YOUR HAPPY BAG</div><h1 class="page-title">我的购物袋</h1><p class="page-intro">已挑选 ${count} 件示例商品，可在这里调整数量。</p><div class="cart-layout"><div class="cart-items">${products.filter(p=>cart[p.id]).map(p=>`<div class="cart-row">${art(p)}<div><h3><a href="#/product/${p.id}">${p.name}</a></h3><p>${p.size} · 示例商品</p><div class="stepper"><button data-cart-qty="${p.id}" data-change="-1" aria-label="减少${p.name}数量">−</button><span>${cart[p.id]}</span><button data-cart-qty="${p.id}" data-change="1" aria-label="增加${p.name}数量">+</button></div><button class="remove" data-remove="${p.id}">移除</button></div><div class="cart-row-price">${money(p.price*cart[p.id])}</div></div>`).join('')}</div><aside class="summary"><h2>订单小计</h2><div class="summary-line"><span>示例商品（${count} 件）</span><span>${money(total)}</span></div><div class="summary-line"><span>配送</span><span>未计算</span></div><div class="summary-total"><span>演示合计</span><strong>${money(total)}</strong></div><a class="btn btn-primary" href="#/checkout">模拟结算 →</a><p class="summary-note">继续后只会展示模拟订单确认，不会收集地址、生成真实订单或付款。</p></aside></div></div>`}
    function checkout(){let {count,total}=cartTotals();if(!count)return cartPage();return `<div class="container page-wrap"><div class="breadcrumb"><a href="#/cart">购物袋</a> / 模拟结算</div><div class="checkout-box"><div class="eyebrow">DEMO CHECKOUT</div><h1 class="page-title">确认这份小快乐</h1><p class="page-intro">这是模拟结算页面。无需填写姓名、电话或地址。</p><div class="checkout-list">${products.filter(p=>cart[p.id]).map(p=>`<div class="summary-line"><span>${p.name} × ${cart[p.id]}</span><strong>${money(p.price*cart[p.id])}</strong></div>`).join('')}</div><div class="summary-total"><span>演示合计 · ${count} 件</span><strong>${money(total)}</strong></div><div class="demo-warning">✦ 点击下方按钮仅会显示模拟完成状态，不会收款、配送或创建真实订单。</div><button class="btn btn-primary" data-confirm style="width:100%">完成模拟结算</button><p class="summary-note" style="text-align:center"><a href="#/cart">← 返回购物袋修改</a></p></div></div>`}
    function success(){return `<div class="container page-wrap"><div class="checkout-box success"><div class="success-icon">🎉</div><div class="eyebrow">DEMO COMPLETE</div><h1 class="page-title">模拟结算完成！</h1><p>你已经体验完整个选购流程。这里没有生成真实订单，也没有发生付款或配送。</p><a class="btn btn-primary" href="#/shop">继续逛逛 →</a></div></div>`}
    function notFound(){return `<div class="container page-wrap"><div class="empty"><div class="empty-icon">🐾</div><h2>这一页走丢啦</h2><a class="btn btn-primary" href="#/">回到首页</a></div></div>`}
    function render(){let route=location.hash.slice(1)||'/';let path=route.split('?')[0];app.innerHTML=path==='/'?home():path==='/shop'?shop():path==='/bestsellers'?bestsellerPage():path==='/cart'?cartPage():path==='/checkout'?checkout():path==='/success'?success():path.startsWith('/product/')?detail(path.split('/')[2]):notFound();document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.getAttribute('data-nav')===(path==='/'?'home':path==='/shop'?'shop':path==='/bestsellers'?'bestsellers':'')));updateCount();window.scrollTo(0,0)}
    document.addEventListener('click',e=>{let add=e.target.closest('[data-add]');if(add){let id=add.dataset.add;cart[id]=Math.min(99,(cart[id]||0)+1);saveCart();toast('已加入购物袋 ✨');return}let addDetail=e.target.closest('[data-add-detail]');if(addDetail){let id=addDetail.dataset.addDetail;cart[id]=Math.min(99,(cart[id]||0)+detailQty);saveCart();toast(`已加入 ${detailQty} 件到购物袋 ✨`);return}let dq=e.target.closest('[data-detail-qty]');if(dq){detailQty=Math.max(1,Math.min(99,detailQty+Number(dq.dataset.detailQty)));document.getElementById('detail-qty').textContent=detailQty;return}let cq=e.target.closest('[data-cart-qty]');if(cq){let id=cq.dataset.cartQty;cart[id]=Math.max(0,Math.min(99,(cart[id]||0)+Number(cq.dataset.change)));if(!cart[id])delete cart[id];saveCart();render();return}let remove=e.target.closest('[data-remove]');if(remove){delete cart[remove.dataset.remove];saveCart();render();toast('已从购物袋移除');return}if(e.target.closest('[data-confirm]')){cart={};saveCart();location.hash='/success'}});
    window.addEventListener('hashchange',render);render();
  </script>
</body>
</html>
